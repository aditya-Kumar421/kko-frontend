<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e40af" />
    <meta
      name="description"
      content="SoochiRail - Guided rail / document routing for KMRL, intelligent document processing and AI-powered knowledge management system"
    />
    <meta name="keywords" content="SoochiRail, KMRL, Metro Rail, Document Processing, AI, Knowledge Management, OCR, Machine Learning" />
    <meta name="author" content="KMRL Tech Team" />

    <title>SoochiRail - KMRL Knowledge Orchestrator</title>

    <style>
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans',
          'Helvetica Neue', sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #f8fafc;
        overflow-x: hidden;
      }

      /* Loading screen */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.6s ease-out;
      }

      .loading-logo {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 25px;
        position: relative;
        font-size: 60px;
      }

      /* Glowing pulse ring */
      .loading-logo::before {
        content: "";
        position: absolute;
        width: 140px;
        height: 140px;
        border: 3px solid #3b82f6;
        border-radius: 50%;
        animation: pulseGlow 2.5s infinite;
      }

      @keyframes pulseGlow {
        0% { transform: scale(0.9); opacity: 0.6; }
        50% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(0.9); opacity: 0.6; }
      }

      /* Emoji bounce animation */
      .loading-logo span {
        display: inline-block;
        animation: bounce 1.2s infinite;
      }

      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      .loading-text {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 12px;
        animation: fadeIn 2s ease-in-out;
      }

      .loading-subtitle {
        color: #94a3b8;
        font-size: 14px;
        margin-bottom: 18px;
        animation: fadeIn 2.5s ease-in-out;
      }

      .loading-tagline {
        text-align: center;
        margin-top: 10px;
        animation: fadeSlideUp 3s ease-in-out;
      }

      .loading-tagline span {
        display: block;
        font-size: 16px;
        margin: 5px 0;
      }

      .loading-tagline .english {
        font-weight: 500;
        color: #f1f5f9;
      }

      .loading-tagline .malayalam {
        font-weight: 500;
        font-family: "Noto Sans Malayalam", sans-serif;
        color: #cbd5e1;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Hide loading screen after app loads */
      .loaded #loading-screen {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-logo">
        <span>🚇</span>
      </div>
      <div class="loading-text">SoochiRail</div>
      <div class="loading-subtitle">Initializing AI systems...</div>
      <div class="loading-tagline">
        <span class="english">“Guided Knowledge Flow”</span>
        <span class="malayalam">“അറിവ് മുന്നോട്ട് കൊണ്ടുപോകുന്നു”</span>
      </div>
    </div>

    <!-- React App Root -->
    <div id="root"></div>

    <!-- Script to remove loader -->
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.body.classList.add('loaded');
          setTimeout(() => {
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) loadingScreen.style.display = 'none';
          }, 600);
        }, 1200);
      });
    </script>
  </body>
</html>
